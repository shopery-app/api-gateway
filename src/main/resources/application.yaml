spring:
  application:
    name: api-gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          authorities-claim-name: authorities
          authority-prefix: ""

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 60s
          routes:
            - id: chat-ws
              uri: lb:ws://chat-ms
              predicates:
                - Path=/ws,/ws/**
              filters:
                - RemoveRequestParameter=token
            - id: core-auth
              uri: lb://core-ms
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/me/password,/api/v1/users/me/email/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 120
                    redis-rate-limiter.requestedTokens: 24
            - id: core-api
              uri: lb://core-ms
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series:
                    exceptions: java.net.ConnectException
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms

    loadbalancer:
      configurations: health-check
      cache:
        enabled: false
      health-check:
        interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
