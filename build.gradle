buildscript {
	apply from: 'versions.gradle'
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az.shopery'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webclient'

	compileOnly "org.projectlombok:lombok:${v.lombok}"

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	annotationProcessor "org.projectlombok:lombok:${v.lombok}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testCompileOnly "org.projectlombok:lombok:${v.lombok}"

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testAnnotationProcessor "org.projectlombok:lombok:${v.lombok}"
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${v.springCloud}"
	}
}

tasks.named('test') {
	enabled = false
}
